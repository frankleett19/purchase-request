<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三花生活館 — 員購申請管理系統</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --sf-navy: #00337A;
  --sf-navy-dark: #002060;
  --sf-navy-mid: #1A4F9C;
  --sf-blue-light: #E8F0FB;
  --sf-blue-mid: #B3CCF0;
  --sf-accent: #1976D2;
  --sf-white: #FFFFFF;
  --sf-gray-bg: #F4F7FC;
  --sf-border: #C8D8EE;
  --sf-text: #1A2B4A;
  --sf-text-muted: #5A6E8A;
  --sf-text-light: #8FA3BC;
  --sf-success: #1B6B3A;
  --sf-success-bg: #E6F4EC;
  --sf-warn: #B45309;
  --sf-warn-bg: #FEF3C7;
  --sf-danger: #9B1C1C;
  --sf-danger-bg: #FEE2E2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Microsoft JhengHei', 'PingFang TC', Arial, sans-serif;
  background: var(--sf-gray-bg);
  color: var(--sf-text);
  font-size: 13px;
  min-height: 100vh;
}

/* ========== LOGIN ========== */
.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(145deg, var(--sf-navy-dark) 0%, var(--sf-navy-mid) 100%);
}
.login-card {
  background: #fff;
  border-radius: 14px;
  padding: 36px 32px;
  width: 340px;
  box-shadow: 0 8px 40px rgba(0,48,122,0.22);
}
.login-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
  justify-content: center;
}
.login-logo-box {
  width: 46px; height: 46px;
  background: var(--sf-navy);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 1px;
}
.login-logo-text { font-size: 15px; font-weight: 700; color: var(--sf-navy); line-height: 1.3; }
.login-title { font-size: 18px; font-weight: 700; color: var(--sf-navy); text-align: center; margin-bottom: 4px; }
.login-sub { font-size: 12px; color: var(--sf-text-muted); text-align: center; margin-bottom: 22px; }
.login-field { margin-bottom: 13px; }
.login-label { font-size: 12px; color: var(--sf-text-muted); margin-bottom: 5px; font-weight: 600; display: block; }
.login-input {
  width: 100%; padding: 9px 11px;
  border: 1px solid var(--sf-border);
  border-radius: 8px; font-size: 13px;
  color: var(--sf-text); background: #fff; outline: none;
  transition: border-color .15s;
}
.login-input:focus { border-color: var(--sf-accent); }
.login-btn {
  width: 100%; padding: 10px;
  background: var(--sf-navy); color: #fff;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  margin-top: 4px; transition: background .15s;
}
.login-btn:hover { background: var(--sf-navy-dark); }
.login-demo { margin-top: 16px; background: var(--sf-blue-light); border-radius: 8px; padding: 11px 13px; }
.login-demo-title { font-size: 11px; font-weight: 700; color: var(--sf-navy); margin-bottom: 7px; }
.demo-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 4px; cursor: pointer; border-radius: 6px;
  transition: background .1s;
}
.demo-item:hover { background: var(--sf-blue-mid); }
.demo-role { font-size: 11px; color: var(--sf-text-muted); width: 75px; }
.demo-cred { font-size: 11px; color: var(--sf-navy); font-family: 'Courier New', monospace; flex: 1; }
.demo-badge { font-size: 10px; padding: 1px 7px; border-radius: 9px; font-weight: 600; }
.badge-store { background: #DBEAFE; color: #1E40AF; }
.badge-sup { background: #EDE9FE; color: #5B21B6; }
.badge-admin { background: #DCFCE7; color: #166534; }
.badge-fin { background: #FEF3C7; color: #92400E; }
.badge-ceo { background: #FFE4E6; color: #9F1239; }
.login-err { font-size: 12px; color: #DC2626; text-align: center; margin-top: 9px; display: none; }

/* ========== APP LAYOUT ========== */
.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 220px; min-width: 220px;
  background: var(--sf-navy);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 16px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; gap: 10px;
}
.sl-icon {
  width: 36px; height: 36px; background: #fff;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--sf-navy); font-weight: 700; font-size: 14px; letter-spacing: .5px;
  flex-shrink: 0;
}
.sl-text { color: #fff; font-size: 13px; font-weight: 700; line-height: 1.35; }
.sl-text span { font-size: 10.5px; opacity: .65; font-weight: 400; }
.sidebar-user {
  padding: 11px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; gap: 9px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name { color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { color: rgba(255,255,255,0.55); font-size: 10.5px; }
.logout-btn { color: rgba(255,255,255,0.5); cursor: pointer; font-size: 16px; padding: 4px; transition: color .15s; }
.logout-btn:hover { color: #fff; }
.nav-group { padding: 7px 0; }
.nav-group-label { font-size: 10px; color: rgba(255,255,255,0.4); padding: 5px 18px 3px; text-transform: uppercase; letter-spacing: .07em; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 18px; font-size: 13px;
  color: rgba(255,255,255,0.72);
  cursor: pointer; border-left: 3px solid transparent;
  transition: all .15s;
}
.nav-item:hover { background: rgba(255,255,255,0.09); color: #fff; }
.nav-item.active { background: rgba(255,255,255,0.15); color: #fff; border-left-color: #fff; font-weight: 600; }
.nav-item .ti { font-size: 16px; }
.badge-count {
  margin-left: auto;
  background: rgba(255,120,50,0.92); color: #fff;
  border-radius: 9px; font-size: 10.5px; padding: 1px 7px; font-weight: 700;
}

/* ========== MAIN ========== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--sf-gray-bg); }
.topbar {
  padding: 12px 22px;
  border-bottom: 1px solid var(--sf-border);
  display: flex; align-items: center; justify-content: space-between;
  background: #fff; flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.back-btn { color: var(--sf-accent); cursor: pointer; font-size: 16px; display: flex; align-items: center; padding: 3px; }
.topbar-title { font-size: 16px; font-weight: 700; color: var(--sf-navy); }
.topbar-sub { font-size: 11.5px; color: var(--sf-text-muted); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

.content { padding: 18px 22px; flex: 1; overflow-y: auto; }
.action-bar {
  padding: 12px 22px;
  border-top: 1px solid var(--sf-border);
  background: #fff; display: flex; gap: 8px; align-items: center;
  flex-shrink: 0;
}

/* ========== BUTTONS ========== */
.btn {
  padding: 7px 15px; border-radius: 8px; font-size: 12.5px;
  cursor: pointer; border: 1px solid var(--sf-border);
  background: #fff; color: var(--sf-text);
  transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
  font-family: inherit; white-space: nowrap;
}
.btn:hover { background: var(--sf-blue-light); border-color: var(--sf-blue-mid); }
.btn-primary { background: var(--sf-navy); color: #fff; border-color: var(--sf-navy); }
.btn-primary:hover { background: var(--sf-navy-dark); }
.btn-success { background: var(--sf-success); color: #fff; border-color: var(--sf-success); }
.btn-success:hover { background: #144d2a; }
.btn-danger-outline { color: var(--sf-danger); border-color: var(--sf-danger); }
.btn-danger-outline:hover { background: var(--sf-danger-bg); }
.btn-print { background: var(--sf-accent); color: #fff; border-color: var(--sf-accent); }
.btn-print:hover { background: #1358a0; }

/* ========== STATS ========== */
.stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 18px; }
.stat-card { background: #fff; border: 1px solid var(--sf-border); border-radius: 10px; padding: 14px 16px; }
.stat-card.hl { border-left: 3px solid var(--sf-navy); }
.stat-num { font-size: 24px; font-weight: 700; color: var(--sf-navy); }
.stat-lbl { font-size: 11.5px; color: var(--sf-text-muted); margin-top: 3px; }

/* ========== ORDER LIST ========== */
.order-list { display: flex; flex-direction: column; gap: 9px; }
.order-card {
  background: #fff; border: 1px solid var(--sf-border);
  border-radius: 10px; padding: 12px 15px;
  cursor: pointer; transition: all .15s;
}
.order-card:hover { border-color: var(--sf-blue-mid); box-shadow: 0 2px 10px rgba(0,51,122,0.08); }
.oc-top { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; flex-wrap: wrap; }
.oc-id { font-size: 13px; font-weight: 700; color: var(--sf-navy); }
.oc-store { font-size: 12px; color: var(--sf-text-muted); }
.oc-items { font-size: 12.5px; color: var(--sf-text-muted); margin-bottom: 5px; }
.oc-meta { display: flex; gap: 14px; font-size: 11.5px; color: var(--sf-text-light); }
.oc-click { font-size: 11.5px; color: var(--sf-accent); margin-top: 5px; }

/* ========== STATUS BADGES ========== */
.sbadge { font-size: 11px; padding: 2px 9px; border-radius: 9px; font-weight: 600; margin-left: auto; white-space: nowrap; }
.s-draft { background: #F1F5F9; color: #64748B; }
.s-pending-sup { background: #FEF3C7; color: #92400E; }
.s-pending-admin { background: #DBEAFE; color: #1E40AF; }
.s-ready { background: #D1FAE5; color: #065F46; }
.s-approved { background: #E0E7FF; color: #3730A3; }
.s-danger { background: #FEE2E2; color: #9B1C1C; }

/* ========== ALERTS ========== */
.alert { border-radius: 9px; padding: 11px 13px; font-size: 12.5px; margin-bottom: 13px; display: flex; align-items: flex-start; gap: 9px; }
.alert .ti { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
.alert-info { background: var(--sf-blue-light); color: var(--sf-navy); }
.alert-success { background: var(--sf-success-bg); color: var(--sf-success); }
.alert-warn { background: var(--sf-warn-bg); color: var(--sf-warn); }

/* ========== FLOW BAR ========== */
.flow-bar {
  display: flex; align-items: center;
  background: #fff; border: 1px solid var(--sf-border);
  border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
}
.fstep { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.fdot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.fdot.done { background: var(--sf-success); color: #fff; }
.fdot.cur { background: var(--sf-navy); color: #fff; }
.fdot.todo { background: #E2E8F0; color: #94A3B8; }
.fstep-lbl { font-size: 10.5px; color: var(--sf-text-muted); text-align: center; white-space: nowrap; }
.farrow { color: var(--sf-border); font-size: 16px; margin-top: -12px; padding: 0 4px; }

/* ========== FORM ========== */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 15px; }
.ff { display: flex; flex-direction: column; gap: 4px; }
.ff.full { grid-column: 1 / -1; }
.flabel { font-size: 12px; color: var(--sf-text-muted); font-weight: 600; }
.finput {
  padding: 8px 11px; border: 1px solid var(--sf-border);
  border-radius: 8px; font-size: 13px; color: var(--sf-text);
  background: #fff; outline: none; transition: border-color .15s;
  font-family: inherit;
}
.finput:focus { border-color: var(--sf-accent); }
.finput[readonly], .finput[disabled] { background: var(--sf-gray-bg); color: var(--sf-text-muted); }
select.finput { cursor: pointer; }

/* ========== ITEMS TABLE ========== */
.items-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 13px; background: #fff; border-radius: 9px; overflow: hidden; border: 1px solid var(--sf-border); }
.items-table th { background: var(--sf-navy); color: #fff; padding: 8px 9px; text-align: left; font-weight: 600; font-size: 11.5px; }
.items-table td { padding: 7px 9px; border-bottom: 1px solid var(--sf-border); color: var(--sf-text); }
.items-table td input { width: 100%; border: none; background: transparent; font-size: 12.5px; color: var(--sf-text); padding: 0; outline: none; font-family: inherit; }
.items-table td.amount { color: var(--sf-accent); font-weight: 600; }
.items-table tr.total-row td { background: var(--sf-blue-light); font-weight: 700; color: var(--sf-navy); border-bottom: none; }

/* ========== PAYMENT BOX ========== */
.payment-box {
  background: var(--sf-blue-light); border: 1px solid var(--sf-blue-mid);
  border-radius: 9px; padding: 11px 14px; font-size: 12.5px;
  color: var(--sf-navy); margin-bottom: 14px;
}
.payment-box .pb-label { font-size: 11px; color: var(--sf-text-muted); margin-bottom: 5px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.payment-box .pb-account { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
.payment-box .pb-note { font-size: 11px; color: var(--sf-text-muted); margin-top: 4px; }

/* ========== SIG ROW ========== */
.sig-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-top: 13px; }
.sig-box { border: 1px solid var(--sf-border); border-radius: 9px; padding: 9px 11px; text-align: center; }
.sig-box-lbl { font-size: 10.5px; color: var(--sf-text-muted); margin-bottom: 14px; line-height: 1.4; }
.sig-box-val { border-top: 1px solid var(--sf-border); padding-top: 5px; font-size: 10.5px; color: var(--sf-text-light); line-height: 1.4; }
.sig-box.done { border-color: #4ADE80; }
.sig-box.done .sig-box-val { color: var(--sf-success); }
.sig-box.waiting { border-color: var(--sf-navy); border-style: dashed; }
.sig-box.waiting .sig-box-val { color: var(--sf-navy); }

/* ========== DETAIL SECTION ========== */
.detail-section { background: #fff; border: 1px solid var(--sf-border); border-radius: 10px; padding: 15px 18px; margin-bottom: 13px; }
.ds-title { font-size: 13px; font-weight: 700; color: var(--sf-navy); margin-bottom: 11px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--sf-border); padding-bottom: 9px; }
.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.kv-key { font-size: 11px; color: var(--sf-text-muted); margin-bottom: 2px; }
.kv-val { font-size: 13px; color: var(--sf-text); font-weight: 600; }

/* ========== NOTIFY BAR ========== */
.notify-bar {
  background: var(--sf-success-bg); border: 1px solid #86EFAC;
  border-radius: 9px; padding: 11px 13px; font-size: 12.5px;
  color: var(--sf-success); display: flex; gap: 9px; align-items: flex-start;
}
.notify-bar .ti { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* ========== SECTION TITLE ========== */
.section-title { font-size: 11.5px; font-weight: 700; color: var(--sf-text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }

/* ========== PRINT STYLES ========== */
@media print {
  body * { visibility: hidden; }
  #printContent, #printContent * { visibility: visible; }
  #printContent { position: fixed; top: 0; left: 0; width: 100%; }
}
</style>
</head>

<!-- ========== LOGIN SCREEN ========== -->
<div id="loadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,30,80,0.7);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
  <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>

      <div id="navSection"></div>
    </div>

    <!-- MAIN -->

        <div class="topbar-left">

      </div>
      <div class="content" id="mainContent"></div>
      <div class="action-bar" id="actionBar"></div>
    </div>
  </div>
</div>

let USERS = Object.assign({}, DEFAULT_USERS);

let REJECT_LOG = [];
let dataLoaded = false;

function gasCallJsonp(params) {
  return new Promise((resolve) => {
    const cbName = 'gasCallback_' + Date.now();
    window[cbName] = function(data) {
      resolve(data);
      delete window[cbName];
      document.getElementById(cbName) && document.getElementById(cbName).remove();
    };
    const qs = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(typeof v === 'object' ? JSON.stringify(v) : v)).join('&');
    const script = document.createElement('script');
    script.id = cbName;
    script.src = GAS_URL + '?' + qs + '&callback=' + cbName;
    script.onerror = () => { resolve({ ok: true }); delete window[cbName]; script.remove(); };
    document.head.appendChild(script);
    setTimeout(() => { resolve({ ok: true }); }, 10000);
  });
}

async function gasCall(params) {
  try {
    return await gasCallJsonp(params);
  } catch(e) {
    console.error('GAS error', e);
    return { ok: true };
  }
}

async function loadFromSheets() {
  showLoading(true);
  const data = await gasCall({ action: 'getAll' });
  if (data) {
    if (data.users && Object.keys(data.users).length > 0) USERS = data.users;
    if (data.orders && data.orders.length > 0) ORDERS = data.orders;
    if (data.rejectLog) REJECT_LOG = data.rejectLog;
  }
  dataLoaded = true;
  showLoading(false);
}

async function saveUsers() {
  await gasCall({ action: 'saveUsers', data: JSON.stringify(USERS) });
}
async function saveOrders() {
  await gasCall({ action: 'saveOrders', data: JSON.stringify(ORDERS) });
}
async function saveRejectLog() {
  await gasCall({ action: 'saveRejectLog', data: JSON.stringify(REJECT_LOG) });
}

function fillLogin(u, p) {
  document.getElementById('loginUser').value = u;
  document.getElementById('loginPass').value = p;
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  // 先用預設帳號驗證，同時載入最新帳號資料
  const localCheck = USERS[u];
  if (!localCheck || localCheck.pass !== p) {
    // 嘗試從 Sheets 載入最新帳號再驗證
    await loadFromSheets();
  }
  const ud = USERS[u];
  if (ud && ud.pass === p) {
    if (!dataLoaded) await loadFromSheets();
    currentUser = { ...ud, username: u };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('sideAvatar').textContent = currentUser.avatar;
    document.getElementById('sideName').textContent = currentUser.role === 'store' ? currentUser.store + '店' : currentUser.name;
    document.getElementById('sideRole').textContent = currentUser.roleLabel + (currentUser.store ? ' — ' + currentUser.store : '');
    const defaults = { store:'new', supervisor:'pending_sup', admin:'pending_admin', finance:'finance_review', ceo:'dashboard' };
    currentScreen = defaults[currentUser.role] || 'new';
    viewingOrder = null;
    renderNav();
    renderScreen();
  } else {
    const err = document.getElementById('loginErr');
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  currentUser = null; viewingOrder = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
}

function sCls(s) {
  return { pending_sup:'s-pending-sup', pending_admin:'s-pending-admin', ready:'s-ready', approved:'s-approved', draft:'s-draft', rejected:'s-danger' }[s] || 's-draft';
}
function sLbl(s) {
  return { pending_sup:'待督導簽核', pending_admin:'待行政審核', ready:'可取貨', approved:'已完成', draft:'草稿', rejected:'已退回' }[s] || s;
}

function flowHtml(status) {
  const steps = ['店長填單','督導簽核','行政審核','通知取貨','財務紙本'];
  const idx = { pending_sup:1, pending_admin:2, ready:3, approved:4 };
  const cur = idx[status] || 0;
  return steps.map((s,i) => {
    const cls = i < cur ? 'done' : i === cur ? 'cur' : 'todo';
    return `<div class="fstep"><div class="fdot ${cls}">${i+1}</div><div class="fstep-lbl">${s}</div></div>${i<4?'<div class="farrow"><i class="ti ti-chevron-right"></i></div>':''}`;
  }).join('');
}

function editUser(uid) {
  const u = USERS[uid];
  document.getElementById('modalTitle').textContent = '編輯帳號';
  document.getElementById('editUid').value = uid;
  document.getElementById('fUid').value = uid;
  document.getElementById('fUid').disabled = true;
  document.getElementById('fName').value = u.name;
  document.getElementById('fPass').value = u.pass;

function closeUserModal() {
  document.getElementById('userModal').style.display = 'none';
}

async function saveUser() {
  const editUid = document.getElementById('editUid').value;
  const uid = editUid || document.getElementById('fUid').value.trim();
  const name = document.getElementById('fName').value.trim();
  const pass = document.getElementById('fPass').value.trim() || '1234';
  const role = document.getElementById('fRole').value;
  const store = document.getElementById('fStore').value.trim();
  const empId = document.getElementById('fEmpId').value.trim();
  if (!uid || !name || !store) { alert('帳號、姓名、店別為必填'); return; }
  USERS[uid] = { pass, name, role, roleLabel: {store:'店長',supervisor:'督導',admin:'行政',finance:'財務'}[role]||role, store, empId, avatar: name[0] };
  closeUserModal();
  goScreen('user_mgmt');
}

}

function calcRow(el) {
  const row = el.closest('tr');
  const inputs = row.querySelectorAll('input[type="number"]');
  const memberPrice = parseFloat(inputs[1]?.value) || 0;
  const qty = parseFloat(inputs[2]?.value) || 0;
  const sub = memberPrice * qty;
  const rowIndex = row.rowIndex;
  const subEl = document.getElementById('sub' + rowIndex);
  if (subEl) subEl.textContent = 'NT$ ' + sub.toLocaleString();
  let grand = 0;
  for (let i = 1; i <= 8; i++) {
    const s = document.getElementById('sub' + i);
    if (s) grand += parseInt(s.textContent.replace(/[^0-9]/g,'')) || 0;
  }
  const gt = document.getElementById('grandTotal');
  if (gt) gt.textContent = 'NT$ ' + grand.toLocaleString();
}

async function doSubmitNew() {
  const empName = document.getElementById('empName')?.value?.trim();
  const empId = document.getElementById('empId')?.value?.trim();
  const managerName = document.getElementById('managerName')?.value?.trim();
  const managerId = document.getElementById('managerId')?.value?.trim();
  if (!empName) { alert('請填寫申購者姓名'); return; }
  if (!empId) { alert('請填寫申購者員工編號'); return; }
  if (!managerName) { alert('請填寫店主管姓名'); return; }
  const total = parseInt(document.getElementById('grandTotal')?.textContent.replace(/[^0-9]/g,'')) || 0;
  if (total === 0) { alert('請至少填寫一項商品'); return; }

  const items = [];
  const rows = document.querySelectorAll('#itemsTable tbody tr:not(.total-row)');
  rows.forEach((row, i) => {
    const inputs = row.querySelectorAll('input');
    const code = inputs[0]?.value?.trim();
    const name = inputs[1]?.value?.trim();
    const price = parseFloat(inputs[2]?.value) || 0;
    const memberPrice = parseFloat(inputs[3]?.value) || 0;
    const qty = parseFloat(inputs[4]?.value) || 0;
    if (code || name) {
      items.push({ no: i+1, code: code||'—', name: name||'—', price, memberPrice, qty, sub: memberPrice * qty });
    }
  });

  if (!confirm(`確定要提交申請單？\n\n店別：${currentUser.store}店\n申購者：${empName}（${empId}）\n店主管：${managerName}\n品項數：${items.length} 項\n合計金額：NT$ ${total.toLocaleString()}\n\n提交後將通知督導進行線上簽核。`)) return;

  const newId = 'EP' + new Date().toISOString().slice(2,10).replace(/-/g,'') + '-' + String(ORDERS.length+1).padStart(3,'0');
  const newOrder = {
    id: newId,
    store: currentUser.store,
    emp: empName,
    empId: empId,
    manager: managerName,
    managerId: managerId || '—',
    date: new Date().toLocaleDateString('zh-TW'),
    status: 'pending_sup',
    total: total,
    items: items,
    supSign: '', adminSign: '', finSign: '', invoice: ''
  };
  ORDERS.unshift(newOrder);
  goScreen('myorders');
}


async function doDeleteOrder(id) {
  const o = ORDERS.find(x => x.id === id);
  if (!o) return;
  if (!confirm(`確定要刪除申請單 ${id}？\n\n此動作無法復原。`)) return;
  const idx = ORDERS.indexOf(o);
  if (idx > -1) ORDERS.splice(idx, 1);
  goScreen('myorders');
}

async function doReject(id) {
  const o = ORDERS.find(x => x.id === id);
  if (!o) return;
  const reason = prompt(`請輸入退回原因（申請單 ${id}）：`) || '未填寫原因';
  REJECT_LOG.unshift({
    orderId: id,
    store: o.store,
    emp: o.emp,
    total: o.total,
    rejectedBy: currentUser.name,
    rejectedRole: currentUser.roleLabel,
    reason: reason,
    time: new Date().toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
  });
  o.status = 'rejected';
  o.supSign = '';
  o.adminSign = '';
  viewingOrder = null;
  const backScreen = currentUser.role === 'supervisor' ? 'pending_sup' : 'pending_admin';
  goScreen(backScreen);
  setTimeout(() => {
    document.getElementById('actionBar').innerHTML = `
      <div class="notify-bar" style="flex:1;background:var(--sf-danger-bg);border-color:#FCA5A5;color:var(--sf-danger);">
        <i class="ti ti-arrow-back-up"></i>
        <div><strong>已退回</strong>，申請單 ${id} 已退回，請店長確認後重新提交。</div>
      </div>`;
  }, 100);
}

async function doSupApprove(id) {
  const o = ORDERS.find(x => x.id === id);
  if (o) {
    o.status = 'pending_admin';
    o.supSign = currentUser.name + ' ' + new Date().toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  }
  document.getElementById('mainContent').innerHTML = screenOrderDetail(o);
  document.getElementById('actionBar').innerHTML = `
    <div class="notify-bar" style="flex:1">
      <i class="ti ti-circle-check"></i>
      <div><strong>簽核完成！</strong>申請單 ${id} 已轉交行政部門進行庫存審核，系統已自動發送通知。</div>
    </div>`;
  document.getElementById('topbarActions').innerHTML = '';
}

async function doAdminApprove(id) {
  const o = ORDERS.find(x => x.id === id);
  if (o) {
    o.status = 'ready';
    o.adminSign = currentUser.name + ' ' + new Date().toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  }
  document.getElementById('mainContent').innerHTML = screenOrderDetail(o);
  document.getElementById('actionBar').innerHTML = `
    <div class="notify-bar" style="flex:1">
      <i class="ti ti-bell-ringing"></i>
      <div><strong>放行完成，已自動通知！</strong> LINE 通知已發送至 ${o.store}店 ${o.emp}：「您的員購申請 ${id} 審核通過，請攜帶此單至門市倉庫取貨。」</div>
    </div>
    <button class="btn btn-print" onclick="doPrint('${id}')"><i class="ti ti-printer"></i> 列印申請單</button>`;
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-print" onclick="doPrint('${id}')"><i class="ti ti-printer"></i> 列印</button>`;
}

async function doFinApprove(id) {
  const o = ORDERS.find(x => x.id === id);
  if (o) {
    o.status = 'approved';
    o.finSign = currentUser.name + ' ' + new Date().toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});

  document.getElementById('actionBar').innerHTML = `

      <strong>完成歸檔</strong>，此申請單 ${id} 全部流程已完成。
    </div>`;
}
